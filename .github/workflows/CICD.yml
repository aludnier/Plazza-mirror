name: CI

on:
    push:
        branches-ignore:  
            - "ga-ignore-*"
    pull_request: 
        branches:
            - main


env:
    MIRROR_URL: "git@github.com:EpitechPGE2-2025/G-CCP-400-PAR-4-1-theplazza-9.git"

jobs:
    check-build:
        name: Check Compilation
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: "actions/checkout@v4"
              with:
                fetch-depth: 0

            - name: Update VM
              run: |
                sudo apt-get update

            - name: try Compile
              run: | 
                rm -rf build/
                cmake -B build/
                cmake --build build
    
    push-to-mirror:
        needs: [check-build]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout Code
              uses: "actions/checkout@v4"
              with:
                fetch-depth: 0

            - name: Push to Epitech Repository
              uses: pixta-dev/repository-mirroring-action@v1
              with:
                target_repo_url: ${{ env.MIRROR_URL }}
                ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}

